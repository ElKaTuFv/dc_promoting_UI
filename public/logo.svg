<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Logo Promosi Discord" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- gradasi dari bawah ke atas: aksen gelap -> blurple -> biru terang -->
    <linearGradient id="body" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4752c4"/>
      <stop offset=".55" stop-color="#5865f2"/>
      <stop offset="1" stop-color="#00a8fc"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f0b232"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffd86b" flood-opacity=".85"/>
    </filter>
  </defs>
  <path fill="url(#body)" d="M40 12H88A28 28 0 0 1 116 40V76A28 28 0 0 1 88 104H60L30 126L40 104A28 28 0 0 1 12 76V40A28 28 0 0 1 40 12Z"/>
  <!-- petir berbentuk huruf Z -->
  <polyline transform="translate(0 -4)" points="38,30 90,30 60,60 80,60 42,92 92,92" fill="none" stroke="url(#bolt)" stroke-width="10" stroke-linejoin="miter" stroke-miterlimit="4" filter="url(#glow)"/>
</svg>
